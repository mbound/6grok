# cargo-deny policy for code shipped as part of 6grok.
# Keep the normal dependency graph permissive-only. Additions outside this list
# require an explicit licensing review and THIRD_PARTY.md update.

[licenses]
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    "https://github.com/mbound/5grok-parser",
]
