[workspace]
members = [
    "crates/6grok-core",
    "crates/6grok-agent",
    "crates/6grok-api",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/mbound/6grok"
rust-version = "1.82"

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive"] }
crc = "3"
nix = { version = "0.31", default-features = false, features = ["term"] }
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "io-util", "signal"] }
fivegrok-parser = { git = "https://github.com/mbound/5grok-parser", rev = "1d9099d5706a55f4624c8fb01c3a2a09fa5497ad" }
