name: Canonicalize SCAT GPLv2 license

on:
  push:
    branches:
      - feature/scat-samsung-sdm

permissions:
  contents: write

jobs:
  canonicalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/scat-samsung-sdm
      - name: Install and verify SCAT GPLv2 text
        run: |
          set -euo pipefail
          mkdir -p LICENSES
          curl -fsSL \
            https://raw.githubusercontent.com/fgsect/scat/361ff551a4fbb30789c46750c00586682a7a9b26/COPYING \
            -o LICENSES/GPL-2.0-or-later.txt
          test "$(git hash-object LICENSES/GPL-2.0-or-later.txt)" = "d159169d1050894d3ea3b98e1c965c4058208fe1"
      - name: Commit canonical license
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add LICENSES/GPL-2.0-or-later.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add verified GPL-2.0-or-later license text"
          git push origin HEAD:feature/scat-samsung-sdm
